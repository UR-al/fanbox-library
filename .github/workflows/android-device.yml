name: Android offline library on device
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'androidApp/**'
      - 'shared/**'
      - 'transfer/**'
      - '*.gradle.kts'
      - '.github/workflows/android-device.yml'

permissions:
  contents: read

jobs:
  offline-library:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM for this runner
        run: sudo setfacl -m u:"$(whoami)":rw /dev/kvm
      - name: Build and run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: bash gradlew :androidApp:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-report
          path: androidApp/build/reports/androidTests/
