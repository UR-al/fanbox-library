name: Build app packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Prepare project Android SDK
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP 'folio-sdk'
          New-Item $sdk -ItemType Directory | Out-Null
          Copy-Item (Join-Path $env:ANDROID_HOME 'licenses') $sdk -Recurse
          sdkmanager "--sdk_root=$sdk" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ANDROID_HOME=$sdk" >> $env:GITHUB_ENV
          "ANDROID_SDK_ROOT=$sdk" >> $env:GITHUB_ENV
      - uses: gradle/actions/setup-gradle@v4
      - name: Set up WiX 3 for jpackage
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'wix.zip'
          $toolsDir = Join-Path $env:RUNNER_TEMP 'folio-wix'
          Invoke-WebRequest https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip -OutFile $archive
          if ((Get-FileHash $archive).Hash -ne '6AC824E1642D6F7277D0ED7EA09411A508F6116BA6FAE0AA5F2C7DAA2FF43D31') { throw 'WiX checksum mismatch' }
          Expand-Archive $archive $toolsDir
          $toolsDir >> $env:GITHUB_PATH
      - name: Test and build
        env:
          SKIKO_RENDER_API: SOFTWARE
        run: .\gradlew.bat :shared:test :transfer:test :desktopApp:test :androidApp:assembleDebug :androidApp:assembleRelease :androidApp:bundleRelease :desktopApp:packageMsi :desktopApp:packageExe
      - uses: actions/upload-artifact@v4
        with:
          name: fanbox-library-build
          if-no-files-found: error
          path: |
            androidApp/build/outputs/apk/debug/*.apk
            androidApp/build/outputs/apk/release/*.apk
            androidApp/build/outputs/bundle/release/*.aab
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/exe/*.exe
